<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="swirlPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">

            <!-- Base -->
            <rect width="200" height="200" fill="#f5f0e6" />

            <!-- Swirl Paths -->
            <g stroke="#dcd4c6" stroke-width="1" fill="none" opacity="0.35">
                <path d="M100,100 m-60,0 a60,60 0 1,1 120,0 a60,60 0 1,1 -120,0" />
                <path d="M100,100 m-40,0 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0" />
                <path d="M100,100 m-20,0 a20,20 0 1,1 40,0 a20,20 0 1,1 -40,0" />
            </g>

            <!-- Decorative curves -->
            <g stroke="#e3dccf" stroke-width="0.8" fill="none" opacity="0.4">
                <path d="M0,100 Q50,50 100,100 T200,100" />
                <path d="M0,120 Q50,70 100,120 T200,120" />
                <path d="M0,80 Q50,30 100,80 T200,80" />
            </g>

        </pattern>
    </defs>

    <rect width="100%" height="100%" fill="url(#swirlPattern)" />
</svg>